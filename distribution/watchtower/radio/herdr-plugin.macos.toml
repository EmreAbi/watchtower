# Watchtower adapter. Upstream runtime files remain byte-for-byte v0.7.1.
# Deliberately no stock setup, global shim, user PATH, or workspace-created hook.
id = "radio"
name = "Radio for Watchtower"
version = "0.7.1"
min_herdr_version = "0.9.0"
description = "Private AgentRadio ledger and relay for Watchtower"
platforms = ["macos"]

[[startup]]
command = ["sh", "bin/hook", "startup"]

[[panes]]
id = "context"
title = "Agent Context"
placement = "tab"
command = ["sh", "bin/hook", "context"]

[[panes]]
id = "view"
title = "Radio"
placement = "tab"
command = ["sh", "bin/radio", "view"]

[[actions]]
id = "open-view"
title = "Open Radio view"
contexts = ["workspace"]
command = ["sh", "bin/hook", "open-view"]
