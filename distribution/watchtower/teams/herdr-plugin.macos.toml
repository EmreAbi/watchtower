id = "watchtower-teams"
name = "Watchtower Teams"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Quick Task, Research and Development workspace templates"
platforms = ["macos"]

[[panes]]
id = "center"
title = "Teams"
placement = "popup"
width = "94%"
height = "94%"
command = ["sh", "bin/center"]

[[panes]]
id = "launch-agent"
title = "Team agent"
placement = "tab"
command = ["sh", "bin/center", "--launch"]
