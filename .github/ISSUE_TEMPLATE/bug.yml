name: Bug report
description: Report a reproducible Watchtower problem.
body:
  - type: markdown
    attributes:
      value: |
        Please read [Contributing to Watchtower](https://github.com/EmreAbi/watchtower/blob/HEAD/CONTRIBUTING.md).
        Include the shortest reproduction and redact credentials, personal data and private project content.
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What is happening now? Describe what you observed, not a guessed cause.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: What are the shortest exact steps or commands that show the problem?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How does this affect you?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Watchtower version, update channel, operating system, and terminal are required. Shell and relevant config are optional.
      value: |
        - Watchtower version:
        - Package / build source:
        - Operating system:
        - Terminal:
        - Shell, if relevant:
        - Relevant config, if any:
    validations:
      required: true
